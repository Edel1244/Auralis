# AURALIS: self-hosted stack
#
#   cp .env.example .env      # then set POSTGRES_PASSWORD and AUTH_SECRET
#   docker compose up -d --build
#   open http://localhost:3000  (the first account you register becomes admin)
#
# S3-compatible storage (MinIO) is optional:
#   docker compose --profile s3 up -d --build   # and set STORAGE_DRIVER=s3 in .env

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: auralis
      POSTGRES_DB: auralis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auralis -d auralis"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    image: auralis:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Bound to the local machine by default. On a server, Caddy (deploy/docker-compose.prod.yml)
      # is the only public entry point. Set AURALIS_BIND=0.0.0.0 to expose it on your LAN.
      - "${AURALIS_BIND:-127.0.0.1}:${AURALIS_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgresql://auralis:${POSTGRES_PASSWORD}@db:5432/auralis?connection_limit=10
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env (at least 32 random characters)}
      APP_URL: ${APP_URL:-http://localhost:3000}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-auralis}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-AURALIS <no-reply@auralis.local>}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-200}
      DEFAULT_STORAGE_QUOTA_MB: ${DEFAULT_STORAGE_QUOTA_MB:-2048}
      REQUIRE_VERIFIED_EMAIL_FOR_UPLOAD: ${REQUIRE_VERIFIED_EMAIL_FOR_UPLOAD:-false}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
    volumes:
      # Local media storage (when STORAGE_DRIVER=local) and the dev mail outbox.
      - media:/app/.data

  minio:
    profiles: ["s3"]
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    # Compose resolves variables in *every* service, even ones whose profile isn't
    # active, so `:?` (required) must not be used here or plain `docker compose up`
    # would fail without S3 settings. MinIO itself refuses to start without these
    # (it requires a user of 3+ and a password of 8+ characters).
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-}
    volumes:
      - minio-data:/data
    ports:
      - "127.0.0.1:9001:9001" # admin console (local only)

  minio-init:
    profiles: ["s3"]
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 $$MINIO_USER $$MINIO_PASS; do sleep 2; done;
      mc mb --ignore-existing local/$$BUCKET;
      mc anonymous set none local/$$BUCKET;
      "
    environment:
      MINIO_USER: ${S3_ACCESS_KEY_ID:-}
      MINIO_PASS: ${S3_SECRET_ACCESS_KEY:-}
      BUCKET: ${S3_BUCKET:-auralis}

volumes:
  db-data:
  media:
  minio-data:
