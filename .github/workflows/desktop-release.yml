name: Desktop release

# Push a tag like v1.0.0 to build the Windows installer and publish it as a
# GitHub Release. The tag must match desktop/package.json's "version".
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Check tag matches the app version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match desktop/package.json version v$version" >&2
            exit 1
          fi

      - run: npm ci --no-audit --no-fund

      - name: Build installer
        run: npx electron-builder --win --publish never

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: AURALIS-windows
          path: |
            desktop/dist/*.exe
            desktop/dist/*.blockmap

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          name: AURALIS ${{ github.ref_name }}
          body_path: docs/releases/${{ github.ref_name }}.md
          files: |
            desktop/dist/*.exe
            desktop/dist/*.blockmap
